[package]
name = "dbzilla-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["serde"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
sqlparser = "0.64.0"
