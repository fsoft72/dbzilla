[package]
name = "dbzilla-drivers"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
dbzilla-core = { version = "0.1.0", path = "../dbzilla-core" }
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
