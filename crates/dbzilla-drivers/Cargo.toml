[package]
name = "dbzilla-drivers"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
dbzilla-core = { version = "0.1.2", path = "../dbzilla-core" }
futures-util = { version = "0.3.34", optional = true }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"], optional = true }
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
uuid = { version = "1.29.2", optional = true }

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql_async", "dep:chrono", "dep:serde_json"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:futures-util", "dep:chrono", "dep:uuid", "dep:serde_json"]

[dev-dependencies]
dtor = "1.0.7"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
