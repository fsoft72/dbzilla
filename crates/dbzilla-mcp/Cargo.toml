[package]
name = "dbzilla-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
dbzilla-core = { version = "0.4.0", path = "../dbzilla-core" }
dbzilla-drivers = { version = "0.4.0", path = "../dbzilla-drivers" }
dbzilla-io = { version = "0.4.0", path = "../dbzilla-io" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
