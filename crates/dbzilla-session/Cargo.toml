[package]
name = "dbzilla-session"
version.workspace = true
edition.workspace = true

[dependencies]
dbzilla-core = { version = "0.5.0", path = "../dbzilla-core" }
dbzilla-drivers = { version = "0.5.0", path = "../dbzilla-drivers" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[dev-dependencies]
async-trait = "0.1.92"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
