[package]
name = "dbzilla-store"
version.workspace = true
edition.workspace = true

[dependencies]
dbzilla-core = { version = "0.4.0", path = "../dbzilla-core" }
directories = "6.0.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
